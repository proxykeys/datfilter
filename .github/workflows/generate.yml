name: Generate Geo Files

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/generate.yml'
  schedule:
    - cron: '20 */6 * * *'

permissions:
  contents: write

concurrency:
  group: datfilter-generate
  cancel-in-progress: true

jobs:
  generate:
    name: Generate optimized geo files
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: false

      - name: Prepare directories
        run: |
          rm -rf data release work
          mkdir -p data release work

      - name: Download source GeoIP files
        env:
          GEOIP_URL: https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/geoip.dat
          SHA256_URL: https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release/sha256sum.txt
        run: |
          echo "Downloading geoip.dat..."
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL -o data/geoip.dat "${GEOIP_URL}"

          echo "Trying to download sha256sum.txt..."
          if curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL -o data/sha256sum.txt "${SHA256_URL}"; then
            grep ' geoip.dat$' data/sha256sum.txt > data/geoip.sha256sum || true
            echo "Checksum file downloaded"
          else
            echo "⚠️ sha256sum.txt not found, skipping checksum download"
            rm -f data/sha256sum.txt data/geoip.sha256sum
          fi

          echo "Downloaded files:"
          ls -lh data/

      - name: Verify GeoIP checksum
        run: |
          cd data
          if [ -s geoip.sha256sum ]; then
            sha256sum -c geoip.sha256sum
          else
            echo "⚠️ geoip checksum not available, skipping verification"
          fi

      - name: Install xray-geodata-cut
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/yichya/xray-geodata-cut@latest

      - name: Clone domain-list-community
        run: |
          git clone --depth=1 https://github.com/v2fly/domain-list-community.git work/domain-list-community

      - name: Inject custom GeoSite categories
        env:
          RU_BLOCKED_URL: https://raw.githubusercontent.com/runetfreedom/russia-blocked-geosite/release/ru-blocked.txt
          RU_NON_RU_URL: https://raw.githubusercontent.com/proxykeys/filter/main/ru-non-ru-domains.txt
          RU_ADS_URL: https://raw.githubusercontent.com/proxykeys/filter/main/release/canonical-ru-ads.txt
        run: |
          echo "Downloading ru-blocked source..."
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL -o work/domain-list-community/data/ru-blocked "${RU_BLOCKED_URL}"

          echo "Downloading ru-non-ru-domains source..."
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL -o work/ru-non-ru-domains.txt "${RU_NON_RU_URL}"

          echo "Downloading canonical-ru-ads source..."
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL -o work/canonical-ru-ads.txt "${RU_ADS_URL}"

          test -s work/ru-non-ru-domains.txt
          test -s work/canonical-ru-ads.txt

          echo "Building category-ru-non-ru and category-ads-ru source files..."
          python3 - << 'PY'
          import pathlib
          import re

          domain_re = re.compile(
              r"^(?=.{1,253}$)(?!-)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])$"
          )

          def build_category(src_path: str, dst_path: str, source_name: str):
              src = pathlib.Path(src_path)
              dst = pathlib.Path(dst_path)

              seen = set()
              out = []

              for lineno, raw in enumerate(src.read_text(encoding="utf-8").splitlines(), start=1):
                  line = raw.strip()
                  if not line or line.startswith("#"):
                      continue

                  if "#" in line and not line.startswith("regexp:"):
                      line = line.split("#", 1)[0].strip()
                      if not line:
                          continue

                  if line.startswith("keyword:") or line.startswith("regexp:"):
                      raise SystemExit(f"Unsupported record in {source_name} at line {lineno}: {raw}")

                  if line.startswith("domain:"):
                      value = line[7:].strip().lower().rstrip(".")
                      record_type = "domain"
                  elif line.startswith("full:"):
                      value = line[5:].strip().lower().rstrip(".")
                      record_type = "full"
                  else:
                      value = line.lower().rstrip(".")
                      record_type = "domain"

                  if not domain_re.match(value):
                      raise SystemExit(f"Invalid domain in {source_name} at line {lineno}: {raw}")

                  record = f"{record_type}:{value}"
                  if record not in seen:
                      seen.add(record)
                      out.append(record)

              dst.write_text("\n".join(out) + ("\n" if out else ""), encoding="utf-8")
              print(f"Generated {dst} with {len(out)} records")

          build_category(
              "work/ru-non-ru-domains.txt",
              "work/domain-list-community/data/category-ru-non-ru",
              "ru-non-ru-domains.txt"
          )

          build_category(
              "work/canonical-ru-ads.txt",
              "work/domain-list-community/data/category-ads-ru",
              "canonical-ru-ads.txt"
          )
          PY

          echo "Preview of ru-blocked:"
          head -20 work/domain-list-community/data/ru-blocked || true
          echo ""

          echo "Preview of category-ru-non-ru:"
          head -20 work/domain-list-community/data/category-ru-non-ru || true
          echo ""

          echo "Preview of category-ads-ru:"
          head -20 work/domain-list-community/data/category-ads-ru || true

      - name: Build full GeoSite database
        run: |
          cd work/domain-list-community
          go mod download
          go run ./
          mv dlc.dat ../geosite-full.dat

      - name: Generate GeoSite file
        run: |
          xray-geodata-cut \
            -type geosite \
            -in work/geosite-full.dat \
            -out release/geosite.dat \
            -keep "private,ru-blocked,category-ru,category-gov-ru,category-ru-non-ru,category-ads-ru"

      - name: Generate GeoIP file
        run: |
          xray-geodata-cut \
            -type geoip \
            -in data/geoip.dat \
            -out release/geoip.dat \
            -keep "private,re-filter,ru" \
            -trimipv6

      - name: Create checksums
        run: |
          cd release
          sha256sum geosite.dat > sha256sum.txt
          sha256sum geoip.dat >> sha256sum.txt

      - name: Display file sizes
        run: |
          echo "=== Generated Files ==="
          ls -lh release/
          echo ""
          echo "=== Size comparison ==="
          du -h data/geoip.dat work/geosite-full.dat release/geosite.dat release/geoip.dat

      - name: Create release note
        run: |
          cat > release/note.md << 'EOF'
          # DatFilter Geo Files
          
          Оптимизированные GeoSite / GeoIP файлы для Xray-core и совместимых клиентов.
          
          ## Включённые категории
          
          ### GeoSite
          - `private` - частные сети и локальные домены
          - `ru-blocked` - заблокированные в России домены
          - `category-ru` - российские домены
          - `category-gov-ru` - российские государственные домены
          - `category-ru-non-ru` - российские сервисы вне `.ru/.su/.рф`, поддерживаемые вручную
          - `category-ads-ru` - канонический российский adblock-список для direct-ветки клиентов
          
          ### GeoIP
          - `private` - частные IP-адреса
          - `ru` - российские IP-адреса
          - `re-filter` - IP из re:filter
          
          ## Источники
          - GeoIP база: [runetfreedom/russia-v2ray-rules-dat](https://github.com/runetfreedom/russia-v2ray-rules-dat)
          - GeoSite base: [v2fly/domain-list-community](https://github.com/v2fly/domain-list-community)
          - `ru-blocked`: [runetfreedom/russia-blocked-geosite](https://github.com/runetfreedom/russia-blocked-geosite)
          - `category-ru-non-ru`: [proxykeys/filter](https://github.com/proxykeys/filter)
          - `category-ads-ru`: [proxykeys/filter/release/canonical-ru-ads.txt](https://github.com/proxykeys/filter)
          - Обрезка итоговых файлов: [xray-geodata-cut](https://github.com/yichya/xray-geodata-cut)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/geosite.dat
            release/geoip.dat
            release/sha256sum.txt
          tag_name: latest
          name: Latest Release
          body_path: release/note.md
          token: ${{ secrets.DATFILTER }}
          fail_on_unmatched_files: true
          overwrite_files: true
